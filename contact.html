<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarcelCTG - Kontakt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.jpg" alt="MarcelCTG Logo">
            <span class="logo-text">Marcel<span>ctv</span></span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">Über mich</a></li>
                <li><a href="streams.html">Streams & Videos</a></li>
                <li><a href="merch.html">Merch</a></li>
                <li><a href="contact.html" class="active">Kontakt</a></li>
            </ul>
        </nav>
        <div class="header-socials">
            <a href="https://twitch.tv" target="_blank"><i class="fab fa-twitch"></i></a>
            <a href="https://youtube.com" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://tiktok.com" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
    </header>

    <main class="content-page">
        <h2>Kontakt & Kooperationen</h2>
        <p class="subtitle">Du hast eine Anfrage, eine Business-Idee oder möchtest mir schreiben? Schreib mir eine Nachricht!</p>

        <div class="contact-container">
            <form class="contact-form" onsubmit="event.preventDefault(); alert('Vielen Dank! Deine Nachricht wurde gesendet.');">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required placeholder="Dein Name">
                </div>
                <div class="form-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" required placeholder="deine.email@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Nachricht</label>
                    <textarea id="message" rows="5" required placeholder="Deine Nachricht..."></textarea>
                </div>
                <button type="submit" class="btn primary">Nachricht senden</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MarcelCTG. Alle Rechte vorbehalten.</p>
    </footer>
</body>
</html>
