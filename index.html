<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarcelCTG — Creator Hub & Shop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-gamepad"></i> Marcel<span>CTG</span></a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Startseite</a></li>
                <li><a href="about.html">Über mich</a></li>
                <li><a href="media.html">Videos & Streams</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html">Community</a></li>
            </ul>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button class="cart-btn" onclick="toggleCart()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-count">0</span>
                </button>
                <button class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
    </header>
    <main>
        <section style="padding: 6rem 2rem; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 4rem; align-items: center;">
            <div>
                <h1 style="font-size: 3.5rem; font-weight: 800; line-height: 1.1; margin-bottom: 1.5rem;">
                    Gaming, Streams & <span style="color:var(--accent);">Custom Content</span>
                </h1>
                <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">
                    Willkommen auf dem offiziellen Hub von MarcelCTG! Entdecke Minecraft Realms, Livestreams und den Merch-Shop.
                </p>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <a href="shop.html" class="btn-primary"><i class="fa-solid fa-bag-shopping"></i> Zum Shop</a>
                    <a href="media.html" class="btn-secondary"><i class="fa-solid fa-play"></i> Letzte Videos</a>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 MarcelCTG. Alle Rechte vorbehalten.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
